# Task Relay configuration. Safe to commit: do not put credentials here.
# Personal machine-only changes belong in .task-relay.local.yaml; keep it untracked and never store secrets in Relay YAML.
version: 2
project:
  name: linear-pi-orchestrator
sources:
  linear:
    use: linear
    with:
      mcp:
        transport: stdio
        command: npx
        args:
          - -y
          - mcp-remote
          - https://mcp.linear.app/mcp
        environment: {}
      reporting:
        runningLabel: relay:running
        blockedLabel: relay:blocked
        doneLabel: relay:done
        inProgressState: In Progress
        commentOnLaunch: true
        commentOnFailure: true
    enabled: true
    pollIntervalMs: 30000
harnesses:
  codex:
    use: codex
actions:
  implement:
    use: launch
    with:
      harness: codex
      mode: interactive
      promptFile: .task-relay/prompts/implement.md
    enabled: true
triggers:
  - id: linear-relay-implement
    source: linear
    enabled: true
    match:
      labels:
        all:
          - relay-implement
        none:
          - relay:running
          - relay:done
          - relay:blocked
      assignee: me
    actions:
      - implement
    fire:
      policy: every-poll
    maxConcurrent: 10
workspace:
  adapter: wt
  directory: .task-relay/workspaces
  baseBranch: main
  branchPrefix: relay
execution:
  maxConcurrent: 10
  retries: 2
  adapter: tmux
  tmuxSession: task-relay-linear-pi-orchestrator
logging:
  level: info
  pretty: true
workflows:
  new-workflow:
    enabled: true
    on:
      source: linear
      match:
        label: relay-test
        statusTypes:
          - started
        assignee: 14b08a5d-74b7-4824-99f9-e3f5c319fd91
        statuses:
          - In Progress
      fire:
        policy: on-change
    timeoutMinutes: 1440
    jobs:
      tmux.create-window-1:
        use: tmux.create-window
        with: {}
        continueOnError: false
        enabled: true
      codex.start-session-2:
        use: codex.start-session
        with:
          model: gpt-5.6-luna
          effort: medium
          tmux:
            action: tmux.create-window-1
          promptFile: .task-relay/prompts/implement.md
        needs:
          job: tmux.create-window-1
          status: started
        continueOnError: false
        enabled: true
      codex.send-prompt-3:
        use: codex.send-prompt
        with:
          codex:
            action: codex.start-session-2
          model: gpt-5.6-luna
          prompt: What model are you now
        needs:
          job: codex.start-session-2
          status: started
        continueOnError: false
        enabled: true
      codex.send-prompt-4:
        use: codex.send-prompt
        with:
          codex:
            action: codex.start-session-2
          prompt: 2 + 44?
          model: gpt-5.6-luna
        needs:
          - job: codex.send-prompt-3
            status: succeeded
          - job: codex.start-session-2
            status: started
        continueOnError: false
        enabled: true
  linear-cleanup-on-done:
    enabled: true
    maxConcurrent: 1
    on:
      source: linear
      match:
        statusTypes:
          - completed
      fire:
        policy: on-change
    targets:
      workers:
        sourceItem: current
        runs: active
    timeoutMinutes: 60
    jobs:
      cleanup-workers:
        use: cleanup
        with:
          activeWorker: stop
          ownedTmuxOnly: true
        continueOnError: false
        enabled: true
