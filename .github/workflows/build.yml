name: Build CLI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── Type-check (fast, runs on every push/PR) ────────────────────────────────
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # ── Build native binaries ───────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.artifact }}
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bun-target: bun-linux-x64
            artifact: task-relay-linux-x64

          - os: macos-latest
            bun-target: bun-darwin-arm64
            artifact: task-relay-macos-arm64

          - os: macos-latest
            bun-target: bun-darwin-x64
            artifact: task-relay-macos-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Verify npm package compatibility
        run: npm run package:smoke

      - name: Compile binary
        run: |
          bun build \
            --compile \
            --target=${{ matrix.bun-target }} \
            --external @nestjs/microservices \
            --external @nestjs/platform-express \
            --external @nestjs/websockets \
            --external class-transformer \
            --external class-validator \
            --outfile=${{ matrix.artifact }} \
            src/cli/main.ts

      - name: Smoke test
        if: matrix.bun-target == 'bun-linux-x64' || matrix.bun-target == 'bun-darwin-arm64'
        run: |
          ./${{ matrix.artifact }} --help
          node scripts/smoke-compiled-cli.mjs ./${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  # ── GitHub Release ───────────────────────────────────────────────────────────
  # main pushes  → update the rolling "latest" release (prerelease)
  # version tags → create a proper versioned release
  release:
    name: Publish release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum task-relay-* > checksums.txt

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}"        >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}"       >> "$GITHUB_OUTPUT"
            echo "prerelease=false"              >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest"                    >> "$GITHUB_OUTPUT"
            echo "name=Latest (main)"            >> "$GITHUB_OUTPUT"
            echo "prerelease=true"               >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            dist/task-relay-*
            dist/checksums.txt
          generate_release_notes: ${{ steps.meta.outputs.prerelease == 'false' }}
          body: |
            ## Install

            macOS and Linux:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/n-filatov/linear-pi-orchestrator/main/install.sh | RELAY_VERSION=${{ steps.meta.outputs.tag }} sh
            ```

            The installer detects the platform, verifies the SHA-256 checksum, and installs `relay` under `~/.local/bin` by default.
